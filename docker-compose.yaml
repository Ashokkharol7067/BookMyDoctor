services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bookmydoctor-backend
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "4000:4000"
    networks:
      - bookmydoctor-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bookmydoctor-frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - bookmydoctor-network

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: bookmydoctor-admin
    restart: always
    ports:
      - "5174:5174"
    depends_on:
      - backend
    networks:
      - bookmydoctor-network


networks:
  bookmydoctor-network