<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .primary { fill: #041E6C; }
      .secondary { fill: #006771; }
      .accent { fill: #4B9EB3; }
      .text-main { font-family: 'Inter', 'Segoe UI', sans-serif; font-weight: 700; font-size: 42px; fill: #006771; }
      .text-sub { font-family: 'Inter', 'Segoe UI', sans-serif; font-weight: 700; font-size: 42px; fill: #041E6C; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" rx="16"/>

  <g transform="translate(30, 25)">
    <!-- Calendar / Stethoscope Icon -->
    <g transform="translate(0, 10)">
      <!-- Main Calendar Body -->
      <rect x="10" y="15" width="70" height="65" rx="12" fill="none" stroke="#041E6C" stroke-width="7" stroke-linejoin="round"/>
      
      <!-- Calendar Grid Dots -->
      <circle cx="30" cy="40" r="4.5" fill="#4B9EB3"/>
      <circle cx="50" cy="40" r="4.5" fill="#4B9EB3"/>
      <circle cx="70" cy="40" r="4.5" fill="#4B9EB3"/>
      <circle cx="30" cy="58" r="4.5" fill="#4B9EB3"/>
      <circle cx="50" cy="58" r="4.5" fill="#4B9EB3"/>
      <circle cx="70" cy="58" r="4.5" fill="#4B9EB3"/>
      
      <!-- Stethoscope Ear Piece Loops (Top of Calendar) -->
      <path d="M 25,15 L 25,5 C 25,2 35,2 35,5 L 35,15" fill="none" stroke="#041E6C" stroke-width="6" stroke-linecap="round"/>
      <path d="M 65,15 L 65,5 C 65,2 75,2 75,5 L 75,15" fill="none" stroke="#041E6C" stroke-width="6" stroke-linecap="round"/>
      
      <!-- Stethoscope Cord Extends From Bottom Left, Loops Under Text -->
      <path d="M 10,45 C -10,45 -5,95 35,95 L 240,95 C 260,95 260,75 260,75" fill="none" stroke="#041E6C" stroke-width="7" stroke-linecap="round"/>
      
      <!-- Stethoscope Chest Piece (End of Cord) -->
      <rect x="252" y="65" width="16" height="12" rx="3" fill="#4B9EB3"/>
    </g>

    <!-- Typography -->
    <g transform="translate(110, 68)">
      <text x="0" y="0" class="text-main">BookMy</text>
      <text x="160" y="0" class="text-sub">Doctor</text>
      <!-- Stylized Dot over 'i' or at the end -->
      <circle cx="298" cy="-32" r="7" fill="#4B9EB3" />
    </g>
  </g>
</svg>