name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm install

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Build Admin
        run: |
          cd admin
          npm install
          npm run build

      - name: Build Backend Docker Image
        run: docker build -t bookmydoctor-backend ./backend

      - name: Build Frontend Docker Image
        run: docker build -t bookmydoctor-frontend ./frontend

      - name: Build Admin Docker Image
        run: docker build -t bookmydoctor-admin ./admin